openapi: 3.0.3
info:
  title: GophKeeper API
  version: 1.0.0
  description: API for GophKeeper password manager
paths:
  /register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Successful registration
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
  /login:
    post:
      summary: Authenticate user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
  /add:
    post:
      summary: Add new data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                data:
                  type: object
                  properties:
                    type:
                      type: string
                    payload:
                      type: string
                      format: byte
                    metadata:
                      type: object
                    timestamp:
                      type: integer
      responses:
        '200':
          description: Data added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
  /get:
    post:
      summary: Get data by ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                id:
                  type: string
      responses:
        '200':
          description: Data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
  /edit:
    post:
      summary: Edit existing data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                data:
                  type: object
      responses:
        '200':
          description: Data edited successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
  /delete:
    post:
      summary: Delete data by ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                id:
                  type: string
      responses:
        '200':
          description: Data deleted successfully
